name: Create Release Assets

on:
  push:
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  # The Apple tests run on macOS before anything publishes.
  test-apple:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Check iOS and macOS
        run: ./gradlew :schnorr256k1-kotlin:iosSimulatorArm64Test :schnorr256k1-kotlin:macosArm64Test :schnorr256k1-kotlin:compileTestKotlinIosArm64

  # Every release goes to Maven Central and to Nostr + Blossom, in two jobs that don't wait for
  # each other: Central's monthly upload limit, or a signer nobody answered, fails one channel
  # without holding back the other, and "Re-run failed jobs" retries only the one that failed.
  # Both run the same checks on the same sources first. The GitHub release comes from the nostr
  # job, so it doesn't wait on Central either.
  #
  # Both publish from macOS, unlike crypto-kmp: the iOS/macOS klibs carry a cinterop (the mulhi
  # multiply-high helpers), and Kotlin cannot cross-compile an Apple klib with a cinterop on a
  # Linux host. macOS builds every target, Linux and Android included.
  central:
    needs: test-apple
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cached Konan
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Linter (gradle)
        run: ./gradlew spotlessCheck

      - name: Check
        run: ./gradlew :schnorr256k1-kotlin:checkKotlinAbi :schnorr256k1-kotlin:jvmTest :schnorr256k1-kotlin:testAndroidHostTest :schnorr256k1-kotlin:linuxX64Test

      # Tag v1.2.3 publishes version 1.2.3.
      - name: Set version for tag
        run: |
          echo "ORG_GRADLE_PROJECT_VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      # vanniktech's plugin signs every file and uploads one bundle to the Central Portal, which
      # releases it automatically once it validates. A version already on Central fails here.
      - name: Publish to Maven Central
        run: ./gradlew :schnorr256k1-kotlin:publishAllPublicationsToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

  # Magpie's publishToNostr (the plugin version is in settings.gradle.kts, the relays in
  # gradle.properties) uploads every file to the release key's Blossom servers (kind 10063) and
  # signs one release event (kind 3071) for all of them, sent to the key's own relays (its
  # kind 10002 and nostr.json). The key never reaches CI: MAGPIE_BUNKER is a NIP-46 bunker URI, so
  # the signer approves each release (the job waits for it), and
  # vitorpamplona.com/.well-known/nostr.json must name the key as "releases" or Magpie refuses to
  # sign. A version already on Nostr fails the job: releases are immutable.
  nostr:
    needs: test-apple
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cached Konan
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Linter (gradle)
        run: ./gradlew spotlessCheck

      - name: Check
        run: ./gradlew :schnorr256k1-kotlin:checkKotlinAbi :schnorr256k1-kotlin:jvmTest :schnorr256k1-kotlin:testAndroidHostTest :schnorr256k1-kotlin:linuxX64Test

      # Tag v1.2.3 publishes version 1.2.3.
      - name: Set version for tag
        run: |
          echo "ORG_GRADLE_PROJECT_VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      # The GPG key signs the files as it does for Maven Central, so the .asc files ship too.
      - name: Publish to Nostr
        run: ./gradlew :schnorr256k1-kotlin:publishToNostr --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          MAGPIE_BUNKER: ${{ secrets.MAGPIE_BUNKER }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
