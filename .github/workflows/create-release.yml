name: Create Release Assets

on:
  push:
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  # The Apple tests run on macOS before anything publishes.
  test-apple:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Check iOS and macOS
        run: ./gradlew :schnorr256k1-kotlin:iosSimulatorArm64Test :schnorr256k1-kotlin:macosArm64Test :schnorr256k1-kotlin:compileTestKotlinIosArm64

  # Publishes from macOS, unlike crypto-kmp: the iOS/macOS klibs carry a cinterop (the mulhi
  # multiply-high helpers), and Kotlin cannot cross-compile an Apple klib with a cinterop on a
  # Linux host. macOS builds every target, Linux and Android included.
  deploy:
    needs: test-apple
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cached Konan
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Linter (gradle)
        run: ./gradlew spotlessCheck

      - name: Check
        run: ./gradlew :schnorr256k1-kotlin:checkKotlinAbi :schnorr256k1-kotlin:jvmTest :schnorr256k1-kotlin:testAndroidHostTest :schnorr256k1-kotlin:linuxX64Test

      - name: Build (gradle)
        run: ./gradlew :schnorr256k1-kotlin:assemble

      # Tag v1.2.3 publishes version 1.2.3.
      - name: Set version for tag
        run: |
          echo "ORG_GRADLE_PROJECT_VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Publish
        run: ./gradlew :schnorr256k1-kotlin:publishAllPublicationsToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
