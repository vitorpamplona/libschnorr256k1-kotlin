[versions]
agp = "9.5.0"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
android-compileSdk = "37"
android-minSdk = "26"
cryptoKmp = "2.1.0"
kotlin = "2.4.21"
kotlinxCoroutines = "1.11.0"
mavenPublish = "0.37.0"
schnorr256k1Kmp = "1.1.0"
secp256k1Kmp = "0.24.0"
spotless = "8.10.4"

[libraries]
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
crypto = { module = "com.vitorpamplona.crypto:crypto", version.ref = "cryptoKmp" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
# Test only: cross-validation against libsecp256k1 (ACINQ) and libschnorr256k1 (C)
schnorr256k1-kmp = { group = "com.vitorpamplona.schnorr256k1", name = "schnorr256k1-kmp", version.ref = "schnorr256k1Kmp" }
secp256k1-kmp = { group = "fr.acinq.secp256k1", name = "secp256k1-kmp", version.ref = "secp256k1Kmp" }
secp256k1-kmp-jni-jvm = { group = "fr.acinq.secp256k1", name = "secp256k1-kmp-jni-jvm", version.ref = "secp256k1Kmp" }

[plugins]
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
diffplugSpotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
