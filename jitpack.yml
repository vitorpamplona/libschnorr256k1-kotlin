# JitPack (jitpack.io) builds a commit or tag on request and serves what lands in ~/.m2:
#   com.github.vitorpamplona.libschnorr256k1-kotlin:schnorr256k1-kotlin:<commit or tag>
# for every target: JVM, Android, iOS, macOS and Linux. JitPack runs Linux, which cannot run the
# Apple cinterop of the hardware multiply-high, so JITPACK=true builds the Kotlin/Native klibs
# with the pure-Kotlin one instead (build.gradle.kts): the same results, slower on native.
# Releases go to Maven Central from macOS, with the hardware one (create-release.yml).
jdk:
  - openjdk21
install:
  # JitPack's maven-mirror init script points Maven Central at a mirror that lags it by days;
  # without MAVEN_CENTRAL_MIRROR it does nothing (as Quartz's jitpack.yml does).
  - env -u MAVEN_CENTRAL_MIRROR ./gradlew :schnorr256k1-kotlin:publishToMavenLocal -PVERSION_NAME=$VERSION --no-configuration-cache
