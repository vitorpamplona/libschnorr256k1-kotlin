#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4096M"
org.gradle.caching=true
org.gradle.configuration-cache=true
#Kotlin
kotlin.code.style=official
# The module declares its own source-set tree (jvmAndroid shared by JVM and Android, nativeMain
# above appleMain and linuxMain), so the default hierarchy template stays off.
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.mpp.enableCInteropCommonization=true
# Apple targets build only on macOS; elsewhere skip them quietly instead of warning.
kotlin.native.ignoreDisabledTargets=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#Maven Publishing
GROUP=com.vitorpamplona.schnorr256k1
POM_ARTIFACT_ID=schnorr256k1-kotlin
VERSION_NAME=1.0.1
# Magpie (Nostr + Blossom publishing, beside Maven Central). The release key's events live on its
# own relays: the ones vitorpamplona.com/.well-known/nostr.json lists for it and its NIP-65 write
# relays. Index relays are only where its relay list (kind 10002) is looked up; archival relays
# get a copy of every release.
magpie.indexRelays=wss://purplepag.es,wss://user.kindpag.es
magpie.archivalRelays=wss://relay.damus.io,wss://nos.lol
